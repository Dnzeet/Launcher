[platformio]
default_envs = lilygo-t-display-ttgo-16mb

[env:lilygo-t-display-ttgo-16mb]
platform = espressif32 @ 6.6.0
board = esp32dev
framework = arduino

board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
board_build.filesystem = littlefs

extra_scripts = pre:support_files/prep_web_files.py

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D BUTTON_1=0
    -D BUTTON_2=35
    -D HAS_SCREEN=1
    -D USE_LITTLEFS=1
    -D STORAGE_BYPASS_SD_TO_LITTLEFS=1
    -D BOARD_HAS_PSRAM=0
    -D BOARD_NAME=\"LilyGO T-Display TTGO (16MB LittleFS)\"

lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    bodmer/TFT_eSPI@^2.5.33
    https://github.com/lorol/LITTLEFS.git
