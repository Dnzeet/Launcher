; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-ttgo]
# Plain ESP32 (not S3), no PSRAM. This unit is the 16MB flash variant.
board = esp32
board_build.f_flash = 80000000L
board_build.partitions = support_files/custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-display-ttgo>
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"Lilygo TTGO T-Display"'
	-DOTA_TAG='"t-display-ttgo"'

	# This specific TTGO T-Display PCB has no SD card slot at all: no SD
	# driver is compiled in, no SD icon/menu, and apps install straight into
	# internal flash (OTA partitions / LittleFS) via the Online Launcher, the
	# WebUI uploader, or the USB Mass Storage drive -- never via SD. This is
	# the exact same mechanism every SD-less board here uses (see
	# lilygo-t-watch-s3), nothing else needed to change.
	-DDISABLE_SDCARD_ICON=1
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	-DROTATION=1

	# Display: ST7789 135x240 over hardware SPI
	-D TFT_DATABUS_N=0
	-D TFT_DISPLAY_DRIVER_N=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=16
	-DTFT_RST=23
	-DTFT_BL=4
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DTFT_IPS=0
	-DTFT_COL_OFS1=0
	-DTFT_ROW_OFS1=0
	-DTFT_COL_OFS2=0
	-DTFT_ROW_OFS2=0

	# Battery: resistive divider on an ADC pin (no gauge/PMIC chip)
	-DANALOG_BAT_PIN=34

	# Only 2 physical buttons on this board (BOOT = GPIO0, KEY = GPIO35), so
	# each one is overloaded: short/double click on BTN1 = Next/Sel, short
	# click / hold on BTN2 = Prev/Esc -- see hal_buttons_init_2.
	-DHAS_2_BUTTONS=1
	-DBUTTONS_IDF_COMPONENT=1

lib_deps =
	${env.lib_deps}
	https://github.com/bmorcelli/ESP32_Button

lib_ignore =
	SensorLib
	XPowersLib
