; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-ttgo]
# Plain ESP32 (not S3), no PSRAM. This unit is the 16MB flash variant.
board = esp32
board_build.f_flash = 80000000L
# Same as custom_16Mb.csv plus one extra "flashfs" LittleFS data partition
# (4MB @ 0x1A0000) that SD_VIA_LITTLEFS (below) mounts in place of an SD
# card, since this board has no SD slot. Kept deliberately small -- the
# rest of the flash (~10.4MB) is left free for installed apps (each full
# firmware install + its data partition is typically ~4MB); resize
# flashfs and installed apps' partitions against each other via the WebUI
# Partition Manager's resize (<->) button as needed. See connections.md.
board_build.partitions = support_files/custom_16Mb_ttgo.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-display-ttgo>
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"Lilygo TTGO T-Display"'
	-DOTA_TAG='"t-display-ttgo"'

	# This specific TTGO T-Display PCB has no SD card slot at all. SDM (the
	# object every file-manager/install function in this codebase already
	# goes through) is redefined to LittleFS, and SD_VIA_LITTLEFS makes
	# setupSdCard() just mount the "flashfs" partition instead of touching
	# real SD hardware. The upshot: the normal "SD" menu -- browse folders,
	# rename, copy/paste, create, delete, pick a .bin to install -- works
	# completely unchanged, just backed by internal flash. See connections.md.
	-DSDM=LittleFS
	-DSD_VIA_LITTLEFS=1

	-DROTATION=1

	# Display: ST7789 135x240 over hardware SPI
	-D TFT_DATABUS_N=0
	-D TFT_DISPLAY_DRIVER_N=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=16
	-DTFT_RST=23
	-DTFT_BL=4
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DTFT_IPS=1
	-DTFT_COL_OFS1=52
	-DTFT_ROW_OFS1=40
	-DTFT_COL_OFS2=53
	-DTFT_ROW_OFS2=40

	# Battery: resistive divider on an ADC pin (no gauge/PMIC chip)
	-DANALOG_BAT_PIN=34

	# Only 2 physical buttons on this board (BOOT = GPIO0/DW_BTN, KEY =
	# GPIO35/UP_BTN). Control scheme is a direct port of the user's Bruce
	# fork for this same board (see interface.cpp): the board talks to the
	# ESP32_Button library (lib_deps below) directly rather than through
	# the generic hal_buttons_init_2/poll_2 HAL helper, since that helper
	# can't reproduce Bruce's hold-to-auto-repeat navigation.

lib_deps =
	${env.lib_deps}
	https://github.com/bmorcelli/ESP32_Button

lib_ignore =
	SensorLib
	XPowersLib
